# IACT API - PostgreSQL Configuration
# Version: 1.0.0
# Usage: source scripts/config/postgres.conf
#        bash scripts/provisioners/postgres/bootstrap.sh
#
# Override any value via environment variable before sourcing.

export POSTGRES_VERSION="${POSTGRES_VERSION:-16}"
export POSTGRES_HOST="${POSTGRES_HOST:-192.168.56.11}"
export POSTGRES_PORT="${POSTGRES_PORT:-5432}"
export POSTGRES_ALLOW_CIDR="${POSTGRES_ALLOW_CIDR:-192.168.56.0/24}"

export DB_NAME="${DB_NAME:-iact_analytics}"
export DB_USER="${DB_USER:-django_user}"
export DB_PASSWORD="${DB_PASSWORD:-django_pass}"
export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-postgres_pass}"
