# IACT API - PostgreSQL Configuration
# Version: 1.1.0
# Adapter: sources project .env and maps DB_* → script vars
#
# Usage:
#   source scripts/config/postgres.conf
#   bash scripts/provisioners/postgres/bootstrap.sh

# Load project .env (single source of truth)
ENV_FILE="${PROJECT_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}/.env"
if [[ -f "$ENV_FILE" ]]; then
    set -a
    # shellcheck disable=SC1090
    source "$ENV_FILE"
    set +a
else
    echo "[ERROR] .env not found: ${ENV_FILE}" >&2
    return 1
fi

# Map Django DB_* → PostgreSQL script vars
export POSTGRES_HOST="${DB_HOST}"
export POSTGRES_PORT="${DB_PORT}"
export POSTGRES_ALLOW_CIDR="${POSTGRES_ALLOW_CIDR:-192.168.56.0/24}"

# DB vars keep same names (DB_NAME, DB_USER, DB_PASSWORD already exported)

# Script-only vars (from .env PROVISIONING section)
export POSTGRES_VERSION="${POSTGRES_VERSION:-16}"
export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:?[ERROR] POSTGRES_PASSWORD not set in .env}"
