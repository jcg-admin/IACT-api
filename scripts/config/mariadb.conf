# IACT API - MariaDB Configuration
# Version: 1.1.0
# Adapter: sources project .env and maps IVR_DB_* → script vars
#
# Usage:
#   source scripts/config/mariadb.conf
#   bash scripts/provisioners/mariadb/bootstrap.sh

# Load project .env (single source of truth)
ENV_FILE="${PROJECT_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}/.env"
if [[ -f "$ENV_FILE" ]]; then
    # Export only — do not execute arbitrary code
    set -a
    # shellcheck disable=SC1090
    source "$ENV_FILE"
    set +a
else
    echo "[ERROR] .env not found: ${ENV_FILE}" >&2
    return 1
fi

# Map Django IVR_DB_* → MariaDB script vars
export MARIADB_HOST="${IVR_DB_HOST}"
export MARIADB_PORT="${IVR_DB_PORT}"
export DB_NAME="${IVR_DB_NAME}"
export DB_USER="${IVR_DB_USER}"
export DB_PASSWORD="${IVR_DB_PASSWORD}"

# Script-only vars (from .env PROVISIONING section)
export MARIADB_VERSION="${MARIADB_VERSION:-11.4}"
export DB_CHARSET="${DB_CHARSET:-utf8mb4}"
export DB_COLLATION="${DB_COLLATION:-utf8mb4_unicode_ci}"
export DB_ROOT_PASSWORD="${DB_ROOT_PASSWORD:?[ERROR] DB_ROOT_PASSWORD not set in .env}"
