# IACT API - MariaDB Configuration
# Version: 1.0.0
# Usage: source scripts/config/mariadb.conf
#        bash scripts/provisioners/mariadb/bootstrap.sh
#
# Override any value via environment variable before sourcing.

export MARIADB_VERSION="${MARIADB_VERSION:-11.4}"
export MARIADB_HOST="${MARIADB_HOST:-192.168.56.10}"
export MARIADB_PORT="${MARIADB_PORT:-3306}"

export DB_NAME="${DB_NAME:-ivr_legacy}"
export DB_CHARSET="${DB_CHARSET:-utf8mb4}"
export DB_COLLATION="${DB_COLLATION:-utf8mb4_unicode_ci}"

export DB_USER="${DB_USER:-django_user}"
export DB_PASSWORD="${DB_PASSWORD:-django_pass}"
export DB_ROOT_PASSWORD="${DB_ROOT_PASSWORD:-root_pass}"
