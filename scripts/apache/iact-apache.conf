# ==============================================================================
# Apache VirtualHost - IACT Call Center
#
# TEMPLATE DE DESARROLLO — valores por defecto para Ubuntu 24.04 local.
# Ajusta las variables de la sección siguiente antes de usar en otro servidor.
#
# Symlink activo:
#   /etc/apache2/sites-available/iact.conf -> (este archivo)
#
# Para aplicar cambios:
#   sudo apache2ctl graceful
# ==============================================================================

# ------------------------------------------------------------------------------
# VARIABLES — ajusta aquí según tu entorno
# ------------------------------------------------------------------------------

# TEMPLATE: ruta raíz del repositorio clonado
Define PROJECT_ROOT    /home/user/IACT-api

# TEMPLATE: directorio del proyecto Django
Define DJANGO_DIR      /home/user/IACT-api/callcentersite

# TEMPLATE: virtualenv del proyecto
Define VENV_DIR        /home/user/IACT-api/venv

# TEMPLATE: archivo wsgi.py
Define WSGI_FILE       /home/user/IACT-api/callcentersite/config/wsgi.py

# TEMPLATE: directorio donde collectstatic deposita los archivos
Define STATIC_ROOT     /var/www/iact/static

# TEMPLATE: directorio de archivos de media subidos por usuarios
Define MEDIA_ROOT      /var/www/iact/media

# TEMPLATE: directorio de logs de Apache
Define LOG_DIR         /var/log/apache2

# TEMPLATE: módulo de settings de Django a cargar
Define DJANGO_SETTINGS config.settings.production

# ------------------------------------------------------------------------------

# --- mod_wsgi: proceso dedicado ----------------------------------------------
WSGIDaemonProcess iact \
    python-home=${VENV_DIR} \
    python-path=${DJANGO_DIR} \
    processes=2 \
    threads=4 \
    display-name=%{GROUP}

WSGIProcessGroup iact

# Pasar el settings module al proceso WSGI
SetEnv DJANGO_SETTINGS_MODULE ${DJANGO_SETTINGS}

# -----------------------------------------------------------------------------
<VirtualHost *:80>

    ServerName   iact.local
    ServerAlias  www.iact.local
    ServerAdmin  webmaster@localhost

    # --- WSGI ----------------------------------------------------------------
    WSGIScriptAlias / ${WSGI_FILE} process-group=iact application-group=%{GLOBAL}

    <Directory ${DJANGO_DIR}/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # --- Archivos estáticos --------------------------------------------------
    Alias /static/ ${STATIC_ROOT}/

    <Directory ${STATIC_ROOT}>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # --- Archivos de media ---------------------------------------------------
    Alias /media/ ${MEDIA_ROOT}/

    <Directory ${MEDIA_ROOT}>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # --- Logs ----------------------------------------------------------------
    ErrorLog  ${LOG_DIR}/iact_error.log
    CustomLog ${LOG_DIR}/iact_access.log combined
    LogLevel  warn

    # --- Seguridad básica ----------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"

</VirtualHost>

