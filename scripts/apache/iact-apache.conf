# ==============================================================================
# Apache VirtualHost - IACT Call Center
# Generado por: scripts/apache/setup_apache.sh
#
# Variables sustituidas por setup_apache.sh:
#   {{PROJECT_ROOT}}           -> raiz del repositorio (IACT-api/)
#   {{DJANGO_DIR}}             -> callcentersite/
#   {{VENV_DIR}}               -> venv/
#   {{WSGI_FILE}}              -> callcentersite/config/wsgi.py
#   {{STATIC_ROOT}}            -> /var/www/iact/static
#   {{MEDIA_ROOT}}             -> /var/www/iact/media
#   {{LOG_DIR}}                -> /var/log/apache2
#   {{DJANGO_SETTINGS_MODULE}} -> config.settings.production
#
# Para editar manualmente despues de instalar:
#   /etc/apache2/sites-available/iact.conf
# ==============================================================================

# --- mod_wsgi: proceso dedicado ------------------------------------------
WSGIDaemonProcess iact \
    python-home={{VENV_DIR}} \
    python-path={{DJANGO_DIR}} \
    processes=2 \
    threads=4 \
    display-name=%{GROUP}

WSGIProcessGroup  iact
WSGIScriptAlias / {{WSGI_FILE}}

# Pasar la variable de entorno al proceso WSGI
SetEnv DJANGO_SETTINGS_MODULE {{DJANGO_SETTINGS_MODULE}}

# -------------------------------------------------------------------------
<VirtualHost *:80>

    ServerName   iact.local
    ServerAlias  www.iact.local
    ServerAdmin  webmaster@localhost

    # --- WSGI -----------------------------------------------------------
    WSGIScriptAlias / {{WSGI_FILE}} process-group=iact application-group=%{GLOBAL}

    <Directory {{DJANGO_DIR}}/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # --- Archivos estaticos ---------------------------------------------
    Alias /static/ {{STATIC_ROOT}}/

    <Directory {{STATIC_ROOT}}>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # --- Archivos de media ----------------------------------------------
    Alias /media/ {{MEDIA_ROOT}}/

    <Directory {{MEDIA_ROOT}}>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # --- Logs -----------------------------------------------------------
    ErrorLog  {{LOG_DIR}}/iact_error.log
    CustomLog {{LOG_DIR}}/iact_access.log combined
    LogLevel  warn

    # --- Seguridad basica -----------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"

</VirtualHost>

