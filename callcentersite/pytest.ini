[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing_local
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# --reuse-db es CRITICO. NO usar --create-db con esta
# suite:
#
# - El proyecto declara TEST['CREATE_DB'] = False para la
#   BD secundaria 'ivr' en
#   config/settings/testing_local.py, pero CREATE_DB no es
#   un setting reconocido por Django (los soportados son
#   MIRROR, CHARSET, COLLATION, NAME, SERIALIZE). Django
#   lo ignora.
# - --create-db hace que pytest-django DROPee y recree
#   test_ivr_legacy independientemente de CREATE_DB. Las
#   tablas que crea la fixture ivr_schema en
#   tests/fixtures/ivr.py se pierden y los tests de
#   integracion pipeline fallan con
#   "table 'test_ivr_legacy.base_ivr_detalle' doesn't
#   exist".
# - --reuse-db conserva la BD entre runs. La fixture
#   ivr_schema es session-scoped y usa CREATE TABLE IF
#   NOT EXISTS (idempotente).
#
# Para forzar recreacion de test_iact_analytics
# (PostgreSQL), preferible drop + create manual antes de
# correr, no --create-db global.
addopts =
    --reuse-db
    --strict-markers
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning
    ignore::RuntimeWarning:django.db.models.base
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    tst_fr: FR conformance test (marker per iniciativa
        auditar-conformidad-fr-tests-aceptacion)
